<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Professional Chat App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- 1. SIGNUP SCREEN -->
  <div id="signup-screen" class="overlay">
    <div class="auth-box">
      <h2>Create an Account</h2>
      <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Username" required autocomplete="off" />
        <input type="email" id="signup-email" placeholder="Email Address" required autocomplete="off" />
        <input type="password" id="signup-password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
      <p class="auth-switch">
        Already have an account? <span id="to-login">Log In</span>
      </p>
    </div>
  </div>

  <!-- 2. LOGIN SCREEN -->
  <div id="login-screen" class="overlay hidden">
    <div class="auth-box">
      <h2>Welcome Back</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email Address" required autocomplete="off" />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
      <p class="auth-switch">
        New here? <span id="to-signup">Create an Account</span>
      </p>
    </div>
  </div>

  <!-- 3. MAIN CHAT APPLICATION CONTAINER -->
  <div id="app-container" class="hidden">
    <aside class="sidebar">
      <!-- Header: Restored to simple original text view -->
      <div class="sidebar-header">
        <h3>Online Users</h3>
        <span id="current-user-badge" class="username-display-text"></span>
      </div>

      <ul id="user-list"></ul>

      <!-- NEW: Dedicated Profile Bottom Footer Container -->
      <div class="sidebar-footer">
        <button id="open-profile-btn" class="profile-trigger-btn">
          Profile
        </button>
      </div>
    </aside>

    <main class="chat-area">
      <div id="chat-header" class="chat-header">
        <h3 id="active-chat-target">
          Select a user from the sidebar to start chatting
        </h3>
      </div>

      <div id="messages-display" class="messages-display"></div>

      <form id="message-form" class="message-form">
        <input type="text" id="message-input" placeholder="Type a private message...!" autocomplete="off" disabled />
        <button type="submit" id="send-btn" disabled>➤</button>
      </form>
    </main>
  </div>

  <!-- 4. PROFILE PAGE OVERLAY MODAL -->
  <div id="profile-modal" class="overlay hidden">
    <div class="auth-box profile-box">
      <h2>Your Profile</h2>
      <div class="profile-details">
        <div class="detail-row">
          <strong>Username:</strong> <span id="profile-username-text">-</span>
        </div>
        <div class="detail-row">
          <strong>Email:</strong> <span id="profile-email-text">-</span>
        </div>
      </div>
      <!-- NEW: Dynamic Theme Picker Layout Section -->
      <div class="theme-picker-section">
        <h4>Choose Chat Palette</h4>
        <div class="palette-options">
          <button class="palette-dot palette-slate active-palette" data-theme="slate" title="Classic Slate"></button>
          <button class="palette-dot palette-emerald" data-theme="emerald" title="Emerald Mint"></button>
          <button class="palette-dot palette-ocean" data-theme="ocean" title="Deep Ocean"></button>
          <button class="palette-dot palette-pink" data-theme="soft-pink" title="Soft Pink"></button>
          <button class="palette-dot palette-purple" data-theme="midnight-purple" title="Midnight Purple"></button>
          <button class="palette-dot palette-orange" data-theme="sunset-orange" title="Sunset Orange"></button>
          <button class="palette-dot palette-wood" data-theme="retro-wood" title="Retro Wood"></button>
        </div>
      </div>
      <button id="logout-btn" class="logout-btn">Log Out</button>
      <button id="close-profile-btn" class="close-btn">Back</button>
    </div>
  </div>

  <!-- Script Scripts Routing Setup -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
